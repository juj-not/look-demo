*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#232326,#161618);display:flex;align-items:center;justify-content:center;gap:36px;padding:24px;flex-wrap:wrap}
.phone{width:390px;height:812px;background:#000;border-radius:54px;padding:10px;box-shadow:0 40px 90px rgba(0,0,0,.6);position:relative;flex-shrink:0}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;position:relative}
.viewport{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .22s;overflow-y:auto;overflow-x:hidden;background:#fff}
.page::-webkit-scrollbar{width:0}
.page.on{opacity:1;pointer-events:auto}
.page .bg{width:100%;display:block}
/* 热区 */
.hz{position:absolute;cursor:pointer;border-radius:8px;background:transparent}
.debug .hz{outline:1.5px dashed rgba(246,88,69,.75);background:rgba(246,88,69,.08)}
/* 动态覆盖 */
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(14px);background:rgba(30,30,30,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;opacity:0;transition:.28s;z-index:300;max-width:84%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:.22s;z-index:190}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 30px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.3,1);z-index:200;max-height:70%;overflow-y:auto}
.sheet.show{transform:none}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.btn{width:100%;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;background:#F0523F;color:#fff;margin-top:12px}
.btn.ghost{background:#eee;color:#555}
.optrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{padding:8px 15px;border-radius:12px;background:#f4f4f5;font-size:13px;cursor:pointer}
.opt.sel{background:#F0523F;color:#fff}
/* 颜色选择器 */
.crow{display:flex;justify-content:center;gap:10px;margin:10px 0}
.cd{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cd.sel{border-color:#F0523F;transform:scale(1.15)}
.seg{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.seg span{padding:5px 18px;border-radius:16px;border:1.5px solid #ddd;font-size:12.5px;cursor:pointer}
.seg span.sel{border-color:#F0523F;color:#F0523F;font-weight:600}
/* 通用覆盖控件 */
.redcheck{position:absolute;width:34px;height:34px;border-radius:50%;background:#F0523F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(240,82,63,.45);z-index:60}
.selbox{position:absolute;border:2.5px solid #F0523F;border-radius:12px;z-index:55;pointer-events:none}
.badge{position:absolute;background:#2D5ED8;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;z-index:60;cursor:pointer}
.flybtn{position:absolute;left:50%;transform:translateX(-50%);background:#F0523F;color:#fff;border:none;border-radius:999px;padding:12px 34px;font-size:15px;font-weight:700;z-index:70;box-shadow:0 8px 22px rgba(240,82,63,.45);cursor:pointer}
.range{position:absolute;z-index:65;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#eee;outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#F0523F;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bubble{position:absolute;max-width:62%;padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.45;z-index:65;animation:pop .25s ease}
.bubble.me{right:12px;background:#F0523F;color:#fff;border-bottom-right-radius:3px}
.bubble.ai{left:12px;background:#f1f1f3;color:#333;border-bottom-left-radius:3px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
/* 随心配卡片 */
.swipewrap{position:absolute;overflow:hidden;border-radius:16px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.18);touch-action:none;cursor:grab}
.swipewrap img{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none}
.heart{position:absolute;font-size:64px;z-index:80;pointer-events:none;opacity:0}
.heart.go{animation:hb .8s ease}
@keyframes hb{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4) translateY(-40px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
.flash.go{animation:fl .5s ease}
@keyframes fl{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.side{color:#bbb;font-size:13px;line-height:2;max-width:300px}
.side b{color:#F57B61}
.side code{background:#333;padding:1px 6px;border-radius:5px;color:#ffd9d3;font-size:12px}
.toolbar button{background:#F0523F;color:#fff;border:none;border-radius:9px;font-size:12px;padding:6px 14px;cursor:pointer}
.toolbar button.on{background:#555}

/* ================= 引擎 ================= */
const vp=document.getElementById('vp');
let stack=['splash'], dbg=false;
const state={gender:'',fitSel:new Set(),fitTab:'试单品',wear:5,qty:1,color:2, body:-1,
  cart:[1,1,1], looks:{}, chatName:'', ranges:[50,50,50,50,50]};

function buildPage(name){
  const p=PAGES[name], el=document.createElement('div');
  el.className='page'; el.id='pg-'+name;
  el.innerHTML=`<div style="position:relative"><img class="bg" src="assets/${p.img}" draggable="false">
    ${(p.hot||[]).map(h=>`<div class="hz" style="left:${h[0]}%;top:${h[1]}%;width:${h[2]}%;height:${h[3]}%" data-h='${JSON.stringify(h.slice(4))}'></div>`).join('')}
    <div class="dyn"></div></div>`;
  el.querySelectorAll('.hz').forEach(z=>z.onclick=e=>{
    e.stopPropagation(); const [a,arg]=JSON.parse(z.dataset.h); run(a,arg,name);
  });
  vp.appendChild(el);
  if(name==='assist') initSwipe(el);
  if(name==='avatar2') initRanges(el);
  return el;
}
function goto(name,push=true){
  if(!document.getElementById('pg-'+name)) buildPage(name);
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));
  document.getElementById('pg-'+name).classList.add('on');
  document.getElementById('pg-'+name).scrollTop=0;
  // 进入页面时渲染动态覆盖层
  if(name==='cart') drawCart();
  if(name==='item') drawWear();
  if(name==='goods'){ drawQty(); drawColors(); }
  if(push){ if(stack[stack.length-1]!==name) stack.push(name); }
}
function back(){
  if(stack.length>1){stack.pop(); goto(stack[stack.length-1],false);} else goto('home',false);
}
function run(a,arg,page){
  if(a==='nav') return goto(arg);
  if(a==='t') return toast(arg);
  if(a==='act') return ACT[arg.split(':')[0]]?.(arg.split(':')[1],page);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML=html;s.classList.add('show');document.getElementById('mask').classList.add('show')}
function closeSheet(){document.getElementById('sheet').classList.remove('show');document.getElementById('mask').classList.remove('show')}
function flash(){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function dyn(name){return document.querySelector('#pg-'+name+' .dyn')}

  fitCat(i){ toast(`筛选：${['上装','下装','鞋','包','配饰'][i]}`) },

  favLook(n){ if(state.looks[n]){toast(`Look ${n} 已收藏 ⭐`)}else{state.looks[n]=1;toast(`已收藏 Look ${n} ⭐ 魔棒可一键换款`)} },

  bodyPick(i){ const el=dyn('avatar'); el.querySelectorAll('.selbox').forEach(e=>e.remove());

  avatarDone(){ toast('数字人身材已保存 ✅'); setTimeout(()=>goto('fitting'),500); },
  takePhoto(){ flash(); toast('AI 识别中…'); setTimeout(()=>{toast('识别成功：米白风衣 · 已自动抠图');setTimeout(()=>goto('item'),600)},800); },

  qty(op){ state.qty=Math.max(1,state.qty+(op==='+'?1:-1)); drawQty(); },

  cQty(i){ state.cart[i]++; drawCart(); toast('数量 +1'); },
  cartClear(){ state.cart=[1,1,1]; drawCart(); toast('购物车已清空（演示重置）'); },
  checkout(){ const t=392+120*(state.cart[0]-1)+40*(state.cart[1]-1)+220*(state.cart[2]-1)+12;

function delMsg(name){ closeSheet(); toast(`已删除与「${name}」的会话`); }
function drawWear(){ const el=dyn('item'); el.querySelectorAll('.badge').forEach(e=>e.remove());
  const b=document.createElement('div'); b.className='badge'; b.style.cssText='left:80%;top:59.5%;background:#fff;color:#333;font-size:14px'; b.textContent=state.wear; el.appendChild(b); }
function drawFitBtn(){ const el=dyn('fitting'); el.querySelectorAll('.flybtn').forEach(e=>e.remove());
  if(state.fitSel.size){ const b=document.createElement('button'); b.className='flybtn'; b.textContent=`开始试穿（已选 ${state.fitSel.size} 件）`;
    b.style.top='90.5%'; b.onclick=()=>{flash();toast('已更新上身效果 ✨ 数字人正在换装…')}; el.appendChild(b); } }
function drawColors(){ const el=dyn('goods'); if(!el)return;
  el.querySelectorAll('.selbox').forEach(e=>e.remove());
  const b=document.createElement('div'); b.className='selbox'; b.style.borderColor='#2D5ED8';
  b.style.cssText+=`left:2.5%;top:${25.8+state.color*8}%;width:11.5%;height:8.5%;border-radius:50%`;
  el.appendChild(b); }
function drawQty(){ const el=dyn('goods'); el.querySelectorAll('.badge').forEach(e=>e.remove());
  const b=document.createElement('div'); b.className='badge'; b.style.cssText='left:19%;top:88.5%;background:#fff;color:#333'; b.textContent='× '+state.qty; el.appendChild(b); }
function drawCart(){ const el=dyn('cart'); if(!el)return;
  el.querySelectorAll('.badge').forEach(e=>e.remove());
  ['25.5%','41.5%','57.5%'].forEach((t,i)=>{ const b=document.createElement('div'); b.className='badge';
    b.style.cssText=`left:80%;top:${t};font-size:10.5px;padding:2px 8px;box-shadow:0 1px 4px rgba(0,0,0,.2)`;
    b.textContent='x'+state.cart[i]; el.appendChild(b); });
  const total=392+120*(state.cart[0]-1)+40*(state.cart[1]-1)+220*(state.cart[2]-1)+12;
  const s=document.createElement('div'); s.className='badge'; s.style.cssText='left:56%;top:84%;background:#fff;color:#F0523F;font-size:14px;box-shadow:none';
  s.textContent='合计 ¥ '+total.toFixed(2); el.appendChild(s); }

/* ---- 随心配：可拖拽卡片 ---- */
const cardQueue=['assist','goods','video']; let cardIdx=0;
function initSwipe(root){
  const p=PAGES.assist, wrap=document.createElement('div');
  wrap.className='swipewrap';
  wrap.style.cssText=`left:6.5%;top:12%;width:87%;height:66%;background:#f3e2e2`;
  setCardFace(wrap, cardQueue[0]);
  root.querySelector('.dyn').appendChild(wrap);
  let sx=0,dx=0,drag=false;
  wrap.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;wrap.setPointerCapture(e.pointerId)});
  wrap.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;
    wrap.style.transform=`translateX(${dx}px) rotate(${dx*.05}deg)`});
  wrap.addEventListener('pointerup',()=>{drag=false;
    if(Math.abs(dx)>90){ dx>0?heartAt(55,40):toast('已跳过'); nextCard(); }
    else wrap.style.transform='';
    dx=0;});
}
function setCardFace(wrap,src){
  let im=wrap.querySelector('img');
  if(!im){ im=document.createElement('img'); wrap.appendChild(im); }
  im.src=`assets/${src}.png`;
  // 裁出各图中心卡片/主体区域作为卡面（源图 390x844 坐标）
  const crop={assist:[28,96,335,590],goods:[0,50,390,640],video:[0,100,390,640]}[src];
  const W=wrap.clientWidth||339, scale=W/crop[2];
  im.style.width=(390*scale)+'px';
  im.style.left=(-crop[0]*scale)+'px';
  im.style.top=(-crop[1]*scale)+'px';
}
function nextCard(){ cardIdx=(cardIdx+1)%cardQueue.length;
  const wrap=document.querySelector('.swipewrap'); if(!wrap)return;
  wrap.style.transition='none'; wrap.style.transform='translateX(-160%) rotate(-14deg)'; wrap.style.opacity='0';
  setTimeout(()=>{ setCardFace(wrap,cardQueue[cardIdx]); wrap.style.transform=''; wrap.style.opacity='1';
    wrap.style.transition='transform .3s,opacity .3s'; },220); }
function heartAt(x,y){ const sc=document.querySelector('.screen');
  const h=document.createElement('div'); h.className='heart go'; h.textContent='❤️';
  h.style.left=x+'%'; h.style.top=y+'%'; sc.appendChild(h); setTimeout(()=>h.remove(),850); }

/* ---- 数字人滑块 ---- */
function initRanges(root){
  const labels=['胸围','腰围','臀围','大腿','手臂'], tops=[57.5,64.5,71.5,78.5,85.5];
  const el=root.querySelector('.dyn');
  labels.forEach((lb,i)=>{ const r=document.createElement('input');
    r.type='range'; r.className='range'; r.min=30; r.max=100; r.value=state.ranges[i];
    r.style.cssText+=`left:22%;top:${tops[i]+1.2}%;width:62%`;
    r.oninput=()=>{state.ranges[i]=+r.value};
    r.onchange=()=>toast(`${lb} 已调整：${r.value}`);
    el.appendChild(r); });
}

function toggleDbg(){ dbg=!dbg; document.querySelector('.screen').classList.toggle('debug',dbg);
  document.getElementById('dbgbtn').classList.toggle('on',dbg); }

// 支持 #home / #home,debug 直接跳转调试
const _h=location.hash.slice(1).split(',');
if(_h[0]&&PAGES[_h[0]]){ goto(_h[0]); if(_h[1]==='debug'&&!dbg) toggleDbg(); }
else goto('splash');
